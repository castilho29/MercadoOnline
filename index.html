const TVARS=['--bg','--card','--tx','--mu','--bd','--ac','--ac2','--b1','--b2','--yl','--fh'];
function aplTemaCat(k){
  const st=document.documentElement.style,t=TEMAS[k];
  if(!t){TVARS.forEach(v=>st.removeProperty(v));st.colorScheme='';return}
  const x={...TEMA0,...t};
  [['--bg',x.bg],['--card',x.card],['--tx',x.tx],['--mu',x.mu],['--bd',x.bd],['--ac',x.ac],['--ac2',x.ac2],['--b1',x.ac],['--b2',x.ach],['--yl',x.yl],['--fh',x.fh]].forEach(([a,b])=>st.setProperty(a,b));
  st.colorScheme=x.dark?'dark':'light';const m=document.querySelector('meta[name=theme-color]');if(m)m.content=x.card;
}

async function pull(){
  for(const t of TB){
    const {data,error}=await sb.from(t).select('data');
    if(error){if(t=='caixa'){S.caixa=S.caixa||[];snap.caixa={};continue}return fail(error)}
    const old=S[t]||[],sn=snap[t],srv=data.map(r=>r.data);
    const merged=srv.map(x=>{const l=old.find(y=>y.id==x.id);return(l&&sn&&sn[x.id]!==undefined&&sn[x.id]!==JSON.stringify(l))?l:x});
    if(sn)old.forEach(l=>{if(sn[l.id]===undefined&&!srv.some(x=>x.id==l.id))merged.push(l)});
    S[t]=merged;snap[t]=Object.fromEntries(srv.map(r=>[r.id,JSON.stringify(r)]));
  }
  S.orders.sort((a,b)=>String(b.date).localeCompare(String(a.date)));loc();
}
async function push(){
  for(const t of TB){
    const cur=Object.fromEntries(S[t].map(r=>[r.id,JSON.stringify(r)])),old=snap[t]||{};
    const up=S[t].filter(r=>cur[r.id]!==old[r.id]).map(r=>({id:r.id,data:r,updated_at:new Date().toISOString()}));
    const del=Object.keys(old).filter(id=>!(id in cur));
    if(up.length){const {error}=await sb.from(t).upsert(up);if(error)throw error}
    if(del.length){const {error}=await sb.from(t).delete().in('id',del);if(error)throw error}
    snap[t]=cur;
  }
}

function getLoc(cb){
  if(!navigator.geolocation)return alert('Este aparelho não oferece localização.');
  const box=document.createElement('div');box.className='gps';box.textContent='📡 Buscando sinal de GPS…';document.body.appendChild(box);
  let best=null,done=false,id,tm;
  const stop=()=>{done=true;navigator.geolocation.clearWatch(id);clearTimeout(tm);box.remove()};
  const fin=()=>{if(done)return;stop();if(!best)return alert('Não foi possível obter a localização. Vá para um local aberto e tente de novo.');cb(best)};
  const err=e=>{
    if(done)return;if(best)return fin();stop();
    alert(e.code==1?'Permissão negada. Ative a localização do navegador (cadeado ao lado do endereço) e tente de novo.':e.code==2?'Sinal de GPS indisponível. Vá para um local aberto e tente de novo.':'Tempo esgotado. Tente de novo em um local aberto.');
  };
  box.onclick=fin;
  id=navigator.geolocation.watchPosition(p=>{
    const a=Math.round(p.coords.accuracy);
    if(!best||a<best.acc)best={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:a};
    box.innerHTML='📡 Precisão: ±'+best.acc+' m<br><small>Toque aqui para usar esta posição</small>';
    if(best.acc<=25)fin();
  },err,{enableHighAccuracy:true,maximumAge:0,timeout:20000});
  tm=setTimeout(fin,20000);
}

function pickImg(inp){
  const f=inp.files[0];if(!f)return;
  const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const k=Math.min(1,240/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    pImg=c.toDataURL('image/jpeg',.7);URL.revokeObjectURL(u);$('#pv').innerHTML=`<img class="ph" alt="" src="${pImg}">`;};
  im.onerror=()=>alert('Não foi possível ler essa imagem.');im.src=u;
}

function finish(){
  const it=items(),c=S.clients.find(x=>x.id==co.cid),t=totalFinal(),cash=parseFloat(co.cash)||0;
  if(!c)return alert('Selecione o cliente.');
  if(co.ent!='retirada'&&taxaAtiva()&&taxaDe(co.bai)==null)return alert('Escolha o bairro da entrega ou selecione "Retirar na loja".');
  if(co.ent!='retirada'&&!co.addr.trim())return alert('Informe o endereço de entrega.');
  if(co.pay=='Dinheiro'&&cash&&cash<t)return alert('O valor para troco é menor que o total.');
  S.orders.unshift({id:uid(),date:new Date().toISOString(),cn:c.n,ph:c.t,addr:co.ent=='retirada'?'Retirada na loja':co.addr.trim(),loc:co.loc,

    troco:co.pay=='Dinheiro'&&cash?cash-t:0,obs:co.obs,done:false,st:'conf',canal:'balcao'});

const bwCache={};
function bwLogo(src,th,lw){
  return new Promise(res=>{
    const k=src.slice(-60)+'|'+th+'|'+lw;if(bwCache[k])return res(bwCache[k]);
    const im=new Image();
    im.onload=()=>{
      const w=Math.max(120,Math.round(lw*8)),h=Math.round(im.height/im.width*w),c=document.createElement('canvas');c.width=w;c.height=h;
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.imageSmoothingQuality='high';x.drawImage(im,0,0,w,h);
      const d=x.getImageData(0,0,w,h),p=d.data,n=w*h,bg=new Uint8Array(n),st=[];
      const add=i=>{if(!bg[i]){bg[i]=1;st.push(i)}};
      for(let i=0;i<w;i++){add(i);add((h-1)*w+i)}for(let j=0;j<h;j++){add(j*w);add(j*w+w-1)}
      while(st.length){
        const i=st.pop(),xx=i%w,yy=(i-xx)/w;
        for(const j of [xx>0?i-1:-1,xx<w-1?i+1:-1,yy>0?i-w:-1,yy<h-1?i+w:-1]){
          if(j<0||bg[j])continue;
          if(Math.abs(p[i*4]-p[j*4])+Math.abs(p[i*4+1]-p[j*4+1])+Math.abs(p[i*4+2]-p[j*4+2])<24)add(j);
        }
      }
      const g=new Float32Array(n),off=th-165;
      for(let i=0;i<n;i++)g[i]=bg[i]?255:Math.max(0,Math.min(255,.299*p[i*4]+.587*p[i*4+1]+.114*p[i*4+2]-off));
      for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){
        const i=y*w+xx,o=g[i],v=o<128?0:255,e=o-v;g[i]=v;
        if(xx+1<w)g[i+1]+=e*7/16;
        if(y+1<h){if(xx>0)g[i+w-1]+=e*3/16;g[i+w]+=e*5/16;if(xx+1<w)g[i+w+1]+=e/16}
      }
      for(let i=0;i<n;i++){const v=g[i]<128?0:255;p[i*4]=p[i*4+1]=p[i*4+2]=v;p[i*4+3]=255}
      x.putImageData(d,0,0);bwCache[k]=c.toDataURL('image/png');res(bwCache[k]);
    };
    im.onerror=()=>res(LOGO_C);im.src=src;
  });
}

const parsePrice=s=>{s=String(s||'').replace(/[R$\s]/g,'');return s.includes(',')?parseFloat(s.replace(/\./g,'').replace(',','.')):parseFloat(s)};
const looksPrice=s=>/^\d+[.,]\d{2}$/.test(String(s).replace(/[R$\s]/g,''));
const looksCode=s=>/^\d{4,}$/.test(String(s).trim());
function fixInv(){
  let n=0;
  S.products.forEach(p=>{
    if(looksPrice(p.cod||'')&&Number.isInteger(p.p)){const np=parsePrice(p.cod);p.cod=String(p.p).padStart(6,'0');p.p=np;n++}
  });
  if(n)save();render();alert(n?n+' produtos corrigidos (preço e código estavam trocados).':'Nenhum produto com preço e código invertidos foi encontrado.');
}
function impCSV(inp){
  const f=inp.files[0];if(!f)return;
  f.text().then(t=>{
    const L=t.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim()),d=(L[0]||'').includes(';')?';':',';
    const row=ln=>ln.split(d).map(x=>x.replace(/^"|"$/g,'').trim());
    let ix={n:0,p:1,c:2,cod:3,u:4,img:5};const h=row(L[0]||'').map(x=>x.toLowerCase()),fd=re=>h.findIndex(x=>re.test(x));
    if(fd(/nome|produto|descri/)>=0&&fd(/pre[çc]o|valor/)>=0){
      ix={n:fd(/nome|produto|descri/),p:fd(/pre[çc]o|valor/),c:fd(/categ/),cod:fd(/c[óo]d(?!.*barra)/),u:fd(/unid/),img:fd(/foto|imagem|img/),bar:fd(/barra|ean|gtin/),est:fd(/estoque|qtd|quant/)};L.shift();
    }
    let n=0,sw=0;
    L.forEach(ln=>{
      const c=row(ln),g=k=>ix[k]>=0?(c[ix[k]]||''):'';
      let ps=g('p'),cod=g('cod');
      if(looksCode(ps)&&looksPrice(cod)){[ps,cod]=[cod,ps];sw++}
      const pr=parsePrice(ps);
      if(!g('n')||isNaN(pr))return;
      const r={n:g('n'),p:pr,c:g('c').toUpperCase(),cod,u:g('u')||'un',...(/^https?:/.test(g('img'))?{img:g('img')}:{}),...(g('bar')?{bar:g('bar')}:{}),...(g('est')!==''&&!isNaN(parseFloat(g('est')))?{est:parseFloat(g('est'))}:{})};
      const o=cod&&S.products.find(x=>x.cod==cod);
      if(o)Object.assign(o,r);else S.products.push({id:rid(),img:'',...r});n++;
    });
    save();render();alert(n+' produtos importados ou atualizados.'+(sw?' '+sw+' linhas tinham preço e código trocados e foram corrigidas.':''));
  });
}

async function revGeo(lat,lng){
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),9000);
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=pt-BR&lat=${lat}&lon=${lng}`,{signal:ac.signal});
    if(!r.ok)throw 0;
    const a=(await r.json()).address||{};
    const rua=a.road||a.pedestrian||a.residential||a.footway||a.path||'',
      bairro=a.suburb||a.neighbourhood||a.quarter||a.city_district||a.hamlet||'',
      cid=a.city||a.town||a.village||a.municipality||'',
      uf=String(a['ISO3166-2-lvl4']||'').split('-')[1]||'',num=a.house_number||'';
    const cidade=cid?cid+(uf?'/'+uf:''):'';
    const addr=(rua?rua+(num?', '+num:'')+(bairro?' - '+bairro:''):bairro)+(cidade?(rua||bairro?', ':'')+cidade:'');
    return {addr,ok:!!rua,rua,num,bai:bairro,cid:cidade};
  }finally{clearTimeout(tm)}
}

/* ===== ESTOQUE, CÓDIGO DE BARRAS ===== */
const stockOf=p=>(p.est===''||p.est==null||isNaN(+p.est))?null:+p.est;
const soldOut=p=>{const s=stockOf(p);return s!==null&&s<=0};
const lowTag=p=>{const s=stockOf(p);return s!==null&&s>0&&s<=5?`<div class="low">Restam ${s}</div>`:''};
function scanAdd(){
  const t=q.trim();if(!t)return;
  const p=S.products.find(x=>x.bar==t||x.cod==t);
  if(!p)return;
  q='';add(p.id,1);
}
function stkAdj(o,sign){
  (o.items||[]).forEach(i=>{const p=S.products.find(x=>x.id==i.pid),s=p&&stockOf(p);if(p&&s!==null)p.est=Math.max(0,s+sign*i.q)});
}
async function syncStock(){
  const {data,error}=await sb.from('products').select('id,est:data->est');
  if(error||!data||busy)return false;
  let ch=false;
  data.forEach(r=>{
    const p=S.products.find(x=>x.id==r.id);if(!p)return;
    const v=(r.est===undefined||r.est==='')?null:r.est;
    if((p.est===undefined||p.est===''?null:p.est)!==v){p.est=v;if(snap.products)snap.products[p.id]=JSON.stringify(p);ch=true}
  });
  if(ch)loc();return ch;
}

/* ===== REPETIR PEDIDO ===== */
function repetir(id){
  const o=(S.mine||[]).find(x=>x.id==id)||S.orders.find(x=>x.id==id);
  if(!o)return;
  const novo={},falt=[],ajust=[];
  (o.items||[]).forEach(i=>{
    const p=S.products.find(x=>x.id==i.pid)||S.products.find(x=>x.n==i.n);
    if(!p||soldOut(p)){falt.push(i.n);return}
    const stk=stockOf(p);let q=i.q;
    if(stk!==null&&q>stk){q=stk;ajust.push(p.n)}
    novo[p.id]=(novo[p.id]||0)+q;
  });
  if(!Object.keys(novo).length)return alert('Nenhum item deste pedido está disponível agora.');
  S.cart=novo;co.ent=o.ent||'entrega';co.bai=o.bairro==='Outros bairros'?'__outro':(o.bairro||'');

let tq='classico',tvol=1,tCustom=null,tAudio=null;

const kvOpen=()=>new Promise((res,rej)=>{const r=indexedDB.open('mezzomo',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const kvGet=async k=>{const d=await kvOpen();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const kvSet=async(k,v)=>{const d=await kvOpen();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})};
const kvDel=async k=>{const d=await kvOpen();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})};
function setCustom(c){tCustom=c;tAudio=c?new Audio(URL.createObjectURL(c.blob)):null}
try{kvGet('toque').then(c=>{if(c&&c.blob)setCustom(c)}).catch(()=>{})}catch(e){}
function tone(f,t,d,type,g){
  const o=AC.createOscillator(),n=AC.createGain(),a=AC.currentTime+t;
  o.type=type;o.frequency.setValueAtTime(f,a);
  n.gain.setValueAtTime(.0001,a);n.gain.exponentialRampToValueAtTime(Math.max(.0002,g*tvol),a+.02);n.gain.exponentialRampToValueAtTime(.0001,a+d);
  o.connect(n);n.connect(AC.destination);o.start(a);o.stop(a+d+.05);
}
function toque(){
  if(tq=='custom'&&tAudio){
    if(!tAudio.paused&&!tAudio.ended)return;
    tAudio.currentTime=0;tAudio.volume=Math.min(1,tvol);tAudio.play().catch(()=>{});return;
  }
  unlock();if(!AC)return;
  if(tq=='sino'){[[1318,0],[1046,.7]].forEach(([f,t])=>{tone(f,t,1.3,'sine',.5);tone(f*2.01,t,.7,'sine',.15)});return}
  if(tq=='sirene'){
    [0,.55].forEach(t=>{
      const o=AC.createOscillator(),n=AC.createGain(),a=AC.currentTime+t;
      o.type='sawtooth';o.frequency.setValueAtTime(620,a);o.frequency.linearRampToValueAtTime(940,a+.25);o.frequency.linearRampToValueAtTime(620,a+.5);
      n.gain.setValueAtTime(Math.max(.0002,.2*tvol),a);n.gain.linearRampToValueAtTime(.0001,a+.5);
      o.connect(n);n.connect(AC.destination);o.start(a);o.stop(a+.52);
    });return;
  }
  [0,.3,.6].forEach((t,i)=>tone(i%2?1100:880,t,.25,'square',.3));
}
function testToque(){if(tAudio){tAudio.pause();tAudio.currentTime=0}toque()}
function setToque(v){tq=v;try{localStorage.setItem('toque',v)}catch(e){}testToque()}
function refToque(){
  const s=$('#tq');if(!s)return;
  const o=s.querySelector('option[value="custom"]');
  if(o){o.disabled=!tCustom;o.textContent=tCustom?'Meu toque: '+tCustom.name:'Meu toque (envie um arquivo)'}
  s.value=tq;
  const d=$('#tdel');if(d)d.hidden=!tCustom;
}
async function pickToque(inp){
  const f=inp.files[0];if(!f)return;
  if(!/^audio\//.test(f.type)&&!/\.(mp3|wav|ogg|m4a|aac)$/i.test(f.name))return alert('Escolha um arquivo de áudio (mp3, wav, ogg ou m4a).');
  if(f.size>3*1024*1024)return alert('O arquivo é grande demais. Use um áudio de até 3 MB.');
  const c={name:f.name,blob:new Blob([f],{type:f.type||'audio/mpeg'})};
  try{await kvSet('toque',c)}catch(e){return alert('Não foi possível guardar o toque neste aparelho.')}
  setCustom(c);tq='custom';try{localStorage.setItem('toque','custom')}catch(e){}
  refToque();testToque();inp.value='';
}
async function delToque(){
  try{await kvDel('toque')}catch(e){}
  setCustom(null);if(tq=='custom'){tq='classico';try{localStorage.setItem('toque',tq)}catch(e){}}
  refToque();
}

function qrMatrix(text){

  for(;v<=14;v++){const cap=T[v][1].reduce((s,[k,d])=>s+k*d,0);if(4+(v<10?8:16)+data.length*8<=cap*8)break}
  if(v>14)return null;
  const [ecn,blk]=T[v],total=blk.reduce((s,[k,d])=>s+k*d,0);
  const bb=[],put=(val,len)=>{for(let i=len-1;i>=0;i--)bb.push((val>>i)&1)};
  put(4,4);put(data.length,v<10?8:16);data.forEach(b=>put(b,8));
  put(0,Math.min(4,total*8-bb.length));while(bb.length%8)bb.push(0);
  const cw=[];for(let i=0;i<bb.length;i+=8)cw.push(parseInt(bb.slice(i,i+8).join(''),2));
  for(let p=0;cw.length<total;p^=1)cw.push(p?0x11:0xEC);
  const exp=[],log=[];let x=1;
  for(let i=0;i<255;i++){exp[i]=x;log[x]=i;x<<=1;if(x&256)x^=0x11D}
  for(let i=255;i<512;i++)exp[i]=exp[i-255];

  let g=[1];
  for(let i=0;i<ecn;i++){const ng=new Array(g.length+1).fill(0);for(let j=0;j<g.length;j++){ng[j]^=g[j];ng[j+1]^=mul(g[j],exp[i])}g=ng}
  const rs=d=>{const r=new Array(ecn).fill(0);for(const b of d){const f=b^r[0];r.shift();r.push(0);if(f)for(let j=0;j<ecn;j++)r[j]^=mul(g[j+1],f)}return r};
  const blocks=[];let p0=0;
  for(const [k,d] of blk)for(let i=0;i<k;i++){blocks.push(cw.slice(p0,p0+d));p0+=d}
  const ecs=blocks.map(rs),out=[],maxd=Math.max(...blocks.map(b=>b.length));
  for(let i=0;i<maxd;i++)blocks.forEach(b=>{if(i<b.length)out.push(b[i])});
  for(let i=0;i<ecn;i++)ecs.forEach(e=>out.push(e[i]));
  const fb=[];out.forEach(b=>{for(let i=7;i>=0;i--)fb.push((b>>i)&1)});
  const n=17+4*v,M=Array.from({length:n},()=>new Array(n).fill(0)),F=Array.from({length:n},()=>new Array(n).fill(false));
  const set=(r,c,val)=>{M[r][c]=val?1:0;F[r][c]=true};
  const finder=(r0,c0)=>{for(let dr=-1;dr<=7;dr++)for(let dc=-1;dc<=7;dc++){const r=r0+dr,c=c0+dc;if(r<0||c<0||r>=n||c>=n)continue;set(r,c,dr>=0&&dr<=6&&dc>=0&&dc<=6&&(dr==0||dr==6||dc==0||dc==6||(dr>=2&&dr<=4&&dc>=2&&dc<=4)))}};

    for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++)set(r+dr,c+dc,Math.max(Math.abs(dr),Math.abs(dc))!=1);

  };
  const penalty=m=>{
    let pen=0,dark=0;
    const line=get=>{let run=1,prev=get(0),s=''+prev;for(let i=1;i<n;i++){const cur=get(i);s+=cur;if(cur==prev)run++;else{if(run>=5)pen+=3+run-5;run=1;prev=cur}}if(run>=5)pen+=3+run-5;
      for(let i=0;i+11<=n;i++){const w=s.substr(i,11);if(w=='10111010000'||w=='00001011101')pen+=40}};
    for(let r=0;r<n;r++){line(i=>m[r][i]);line(i=>m[i][r]);for(let c=0;c<n;c++){dark+=m[r][c];if(r<n-1&&c<n-1&&m[r][c]==m[r][c+1]&&m[r][c]==m[r+1][c]&&m[r][c]==m[r+1][c+1])pen+=3}}
    pen+=(Math.ceil(Math.abs(dark*20-n*n*10)/(n*n))-1)*10;
    return pen;
  };
  let best=null,bp=1e9;
  for(let mk=0;mk<8;mk++){const m=withMask(mk),pn=penalty(m);if(pn<bp){bp=pn;best=m}}
  return best;
}
/* ===== PIX COPIA E COLA + QR CODE ===== */
const ascii=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'');
const pixTxt=t=>ascii(t).toUpperCase().replace(/[^A-Z0-9 ]/g,'').replace(/\s+/g,' ').trim();
const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function pixKeyNorm(k,t){
  k=String(k||'').trim();const d=k.replace(/\D/g,'');
  if(t=='cpf')return d.length==11?d:'';
  if(t=='cnpj')return d.length==14?d:'';
  if(t=='cel'){const n=d.length>=12&&d.startsWith('55')?d.slice(2):d;return n.length==10||n.length==11?'+55'+n:''}
  if(t=='email')return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(k)&&k.length<=77?k.toLowerCase():'';
  return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(k)?k.toLowerCase():'';
}
function pixCode(o){
  const key=pixKeyNorm(EMP.pix,EMP.pixT||'cnpj');if(!key)return '';
  const nome=pixTxt(EMP.n).slice(0,25)||'LOJA',cid=pixTxt(String(EMP.c||'').split('/')[0]).slice(0,15)||'BRASIL';
  const val=Math.round((o.total||0)*100)/100;
  const txid=('PED'+String(o.id).replace(/[^A-Za-z0-9]/g,'').slice(-10)).toUpperCase();
  const p='000201010211'+tlv('26',tlv('00','BR.GOV.BCB.PIX')+tlv('01',key))+'52040000'+'5303986'+(val>0?tlv('54',val.toFixed(2)):'')+'5802BR'+tlv('59',nome)+tlv('60',cid)+tlv('62',tlv('05',txid))+'6304';
  return p+crc16(p);
}
async function showPix(x,fresh){
  const o=typeof x=='object'?x:((S.mine||[]).find(y=>y.id==x)||S.orders.find(y=>y.id==x));
  if(!o)return;
  const code=pixCode(o);
  if(!code)return alert('A loja ainda não cadastrou a chave Pix.');
  closePix();
  const m=document.createElement('div');m.id='pixm';m.className='pixm';
  const zap=tel()?`<a class="b s w" style="margin-top:8px" target="_blank" rel="noopener" href="https://wa.me/${waNum(tel())}?text=${encodeURIComponent('Olá! Fiz o pagamento Pix do pedido #'+o.id.slice(-4).toUpperCase()+' ('+R(o.total)+'). Segue o comprovante.')}">Enviar comprovante pelo WhatsApp</a>`:'';
  m.innerHTML=`<div class="pixb"><h2>💠 ${fresh?'Pedido enviado! ':''}Pague com Pix</h2>
  <p class="mu" style="margin:0">Valor do pedido</p><div class="tot" style="margin-bottom:6px">${R(o.total)}</div>
  <div id="pixqr" class="pixqr"></div>
  <label>Pix copia e cola</label><textarea id="pixc" readonly rows="4" onclick="this.select()">${esc(code)}</textarea>
  <button class="b w" onclick="copyPix()">📋 Copiar código Pix</button>
  <p class="mu">No app do seu banco, escolha <b>Pix → Pix Copia e Cola</b>, cole o código e confirme. Ou leia o QR Code acima. A loja confirma o pedido quando o pagamento chegar.</p>${zap}
  <button class="b rd w" style="margin-top:8px" onclick="closePix()">Fechar</button></div>`;
  document.body.appendChild(m);
  const q=qrMatrix(code),e=$('#pixqr');
  if(q&&e){
    const n=q.length,mg=4;let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q[r][c])d+=`M${c+mg} ${r+mg}h1v1h-1z`;
    e.innerHTML=`<svg viewBox="0 0 ${n+2*mg} ${n+2*mg}" shape-rendering="crispEdges" role="img" aria-label="QR Code Pix"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
}
function closePix(){const m=$('#pixm');if(m)m.remove()}
function copyPix(){
  const t=$('#pixc'),code=t.value,ok=()=>toastMsg('✅ Código Pix copiado!');
  (navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(ok,()=>{t.select();try{document.execCommand('copy');ok()}catch(e){toastMsg('Toque e segure no código para copiar.')}});
}

/* ===== TAXA DE ENTREGA POR BAIRRO ===== */
const bkey=s=>ascii(String(s||'')).toUpperCase().replace(/[^A-Z0-9 ]/g,'').replace(/\s+/g,' ').trim();
const padOn=()=>EMP.taxaPad!==''&&EMP.taxaPad!=null&&!isNaN(+EMP.taxaPad);
const taxaAtiva=()=>(EMP.taxas||[]).length>0||padOn();
function taxaDe(b){
  if(b==='__outro')return padOn()?+EMP.taxaPad:null;
  if(!b)return null;
  const t=(EMP.taxas||[]).find(x=>bkey(x.b)==bkey(b));
  return t?+t.v:null;
}
function taxaAtual(){
  if(!taxaAtiva()||co.ent=='retirada')return 0;
  const t=taxaDe(co.bai);return t==null?0:Math.round(t*100)/100;
}
const totalFinal=()=>Math.round((total()+taxaAtual())*100)/100;
const bairroNome=()=>co.ent=='retirada'||!taxaAtiva()?'':(co.bai==='__outro'?'Outros bairros':(co.bai||''));
const _vc3=vCart;
vCart=function(){
  let h=_vc3();
  if(!items().length||!taxaAtiva())return h;
  if(!co.bai&&co.ent!='retirada'){
    const src=CUST?me:S.clients.find(c=>c.id==co.cid);
    if(src&&src.bai){const m=(EMP.taxas||[]).find(x=>bkey(x.b)==bkey(src.bai));if(m)co.bai=m.b;else if(padOn())co.bai='__outro'}
  }
  const ent=co.ent=='retirada'?'retirada':'entrega',tx=taxaDe(co.bai);
  const opts=(EMP.taxas||[]).slice().sort((a,b)=>a.b.localeCompare(b.b,'pt-BR')).map(t=>`<option value="${esc(t.b)}" ${co.bai===t.b?'selected':''}>${esc(t.b)} — ${R(t.v)}</option>`).join('')
    +(padOn()?`<option value="__outro" ${co.bai==='__outro'?'selected':''}>Outros bairros — ${R(+EMP.taxaPad)}</option>`:'');
  const blk=`<label>Como você quer receber?</label><div class="g2" style="margin-bottom:8px"><button class="b ${ent=='entrega'?'':'s'}" onclick="co.ent='entrega';render()">🛵 Entrega</button><button class="b ${ent=='retirada'?'':'s'}" onclick="co.ent='retirada';render()">🏪 Retirar na loja</button></div>`
    +(ent=='entrega'?`<label>Bairro da entrega</label><select onchange="co.bai=this.value;render()"><option value="">Selecione o bairro</option>${opts}</select>${co.bai&&tx==null?'<p class="mu">Não entregamos neste bairro.</p>':''}`:'<p class="mu">Sem taxa. Retire o pedido na loja.</p>');
  h=h.replace('<label>Endereço de entrega</label>',blk+'<label>Endereço de entrega</label>');
  h=h.replace('<span>Total</span><span class="tot">'+R(total())+'</span>','<span>Subtotal</span><span>'+R(total())+'</span></div><div class="row"><span>Taxa de entrega</span><span>'+(ent=='retirada'?'sem taxa':(tx==null?'escolha o bairro':R(taxaAtual())))+'</span></div><div class="row"><span>Total</span><span class="tot">'+R(totalFinal())+'</span>');
  setTimeout(trocoTxt,0);
  return h;
};
function txHtml(){
  return (EMP.taxas||[]).map((t,i)=>`<div class="g2tx"><input value="${esc(t.b)}" placeholder="Nome do bairro" oninput="EMP.taxas[${i}].b=this.value"><input type="number" inputmode="decimal" min="0" step="0.5" value="${t.v}" placeholder="R$" oninput="EMP.taxas[${i}].v=parseFloat(this.value)||0"><button class="b rd" style="padding:0" onclick="txDel(${i})" aria-label="Remover bairro">✕</button></div>`).join('')||'<p class="mu">Nenhum bairro cadastrado: a entrega não tem taxa.</p>';
}
function txAdd(){EMP.taxas=EMP.taxas||[];EMP.taxas.push({b:'',v:0});$('#txl').innerHTML=txHtml()}
function txDel(i){EMP.taxas.splice(i,1);$('#txl').innerHTML=txHtml()}

applyEmp();
init();
