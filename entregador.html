<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E4FD8"><title>Entregas</title>
<link rel="icon" href="favicon-64.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;--bg:#F2F4F8;--card:#fff;--tx:#17202E;--mu:#5F6B7D;--bd:#DFE4EC;--ac:#1E4FD8;--ac2:#E8EEFF;--ok:#178A4E;--ok2:#E3F5EB;--wn:#A15C00;--wn2:#FFF3DF;--rd:#C02A22;--rd2:#FDECEA}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#10141B;--card:#1A202B;--tx:#EEF1F6;--mu:#9AA5B6;--bd:#2C3442;--ac:#6E95FF;--ac2:#1D2742;--ok:#4CC383;--ok2:#163024;--wn:#F0B35A;--wn2:#33270F;--rd:#FF7A70;--rd2:#3A1A18}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--ac);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:10px}
header b{font-size:18px}header small{display:block;opacity:.85}header .sp{flex:1}
.tabs{display:flex;gap:8px;padding:10px 16px 0;position:sticky;top:58px;background:var(--bg);z-index:4}
.tabs button{flex:1;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 4px;font:700 14.5px inherit;font-family:inherit}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{padding:10px 16px 90px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.nm{font-size:19px;font-weight:800}.mu{color:var(--mu)}
.tag{display:inline-block;border-radius:8px;padding:3px 8px;font-size:12.5px;font-weight:800}.tag.ok{background:var(--ok2);color:var(--ok)}.tag.wn{background:var(--wn2);color:var(--wn)}.tag.ac{background:var(--ac2);color:var(--ac)}
.end{font-size:17px;font-weight:700;margin:8px 0 2px}.ref{background:var(--wn2);color:var(--wn);border-radius:10px;padding:8px 10px;margin:8px 0;font-weight:600}
.din{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:17px;font-weight:700;background:var(--ok2);color:var(--ok)}.din small{display:block;font-weight:600;font-size:14px}
.din.cart{background:var(--ac2);color:var(--ac)}.din.pix{background:var(--wn2);color:var(--wn)}
.bts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.b{display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:800 16px inherit;font-family:inherit;text-decoration:none;cursor:pointer;padding:0 12px}
.b.s{background:var(--card);color:var(--tx);border:1.5px solid var(--bd)}.b.ok{background:var(--ok)}.b.w{grid-column:1/-1}.b[disabled]{opacity:.5}
details{margin-top:8px}summary{cursor:pointer;color:var(--ac);font-weight:700}ul{margin:6px 0;padding-left:20px}
.res{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}.res>div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center}.res b{display:block;font-size:20px}.res small{color:var(--mu);font-size:12.5px}
.res .sal{background:var(--ok2);border-color:transparent}.res .sal b{color:var(--ok)}
.lin{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.lin:last-child{border:0}
.vazio{text-align:center;padding:40px 10px}.vazio div{font-size:50px}
input{font:inherit;width:100%;padding:14px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);margin:6px 0;text-align:center;font-size:24px;letter-spacing:.15em;text-transform:uppercase}
.err{color:var(--rd);font-weight:700;min-height:22px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}.ov .card{width:100%;max-width:640px;border-radius:20px 20px 0 0;margin:0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#17202E;color:#fff;border-radius:12px;padding:12px 14px;font-weight:700;z-index:30;text-align:center}
</style></head><body>
<header><div><b id="hn">Entregas</b><small id="hs">Mercado Online</small></div><div class="sp"></div><button class="b s" style="min-height:40px;font-size:14px" onclick="carregar(true)">↻ Atualizar</button></header>
<div class="tabs" id="tabs" hidden><button id="t1" class="on" onclick="aba='fila';desenhar()">Entregar</button><button id="t2" onclick="aba='feitas';desenhar()">Hoje</button><button id="t3" onclick="aba='ganhos';desenhar()">💰 Ganhos</button></div>
<main id="m"><div class="vazio"><div>🏍️</div><p class="mu">Carregando…</p></div></main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=v=>'R$ '+(+v||0).toFixed(2).replace('.',','),dig=v=>String(v||'').replace(/\D/g,'');
const MO=window.MO_CFG||{},sb=(window.supabase&&String(MO.sbUrl||'').startsWith('http'))?window.supabase.createClient(MO.sbUrl,MO.sbKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'mo-entregador'}}):null;
let EU=null,L=[],G=null,aba='fila',vistos=new Set(),primeira=true;
const toast=t=>{const b=document.createElement('div');b.className='toast';b.textContent=t;document.body.appendChild(b);setTimeout(()=>b.remove(),3500)};
function bip(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[0,.25].forEach((t,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=i?1320:880;g.gain.setValueAtTime(.25,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.3);o.connect(g);g.connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+.32)});if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}}
async function sessao(){
  let {data}=await sb.auth.getSession();if(data&&data.session)return data.session;
  const r=await sb.auth.signInAnonymously();if(r.error)throw new Error(/anonymous/i.test(r.error.message)?'A loja precisa ligar "Allow anonymous sign-ins" no Supabase.':r.error.message);return r.data.session;
}
function telaCodigo(msg){
  $('#tabs').hidden=true;
  $('#m').innerHTML=`<div class="card" style="margin-top:20px"><h2 style="margin:0 0 6px">🏍️ Entrar como entregador</h2><p class="mu">Peça o código na loja (Gestão › Entregadores) ou escaneie o QR Code que aparece lá.</p>
  <input id="cod" maxlength="9" placeholder="XXXX-XXXX" autocomplete="one-time-code" onkeydown="if(event.key=='Enter')parear()"><div class="err" id="er">${esc(msg||'')}</div>
  <button class="b w" onclick="parear()">Entrar</button></div>`;
}
async function parear(c){
  c=c||($('#cod')?$('#cod').value:'');
  try{const r=await sb.rpc('entregador_parear',{p_codigo:c});if(r.error)throw r.error;history.replaceState(null,'',location.pathname);toast('Pronto! Este celular agora recebe as entregas.');await iniciar()}
  catch(e){telaCodigo(e.message||String(e))}
}
async function iniciar(){
  if(!sb){$('#m').innerHTML='<div class="card">O site ainda não foi configurado (config.js).</div>';return}
  try{await sessao()}catch(e){$('#m').innerHTML='<div class="card err">'+esc(e.message)+'</div>';return}
  const h=(location.hash.match(/c=([A-Za-z0-9-]+)/)||[])[1];if(h)return parear(h);
  const r=await sb.rpc('entregador_eu');EU=r.data;
  if(!EU)return telaCodigo();
  $('#hn').textContent='Olá, '+EU.nome.split(' ')[0];$('#hs').textContent=EU.loja||'Entregas';document.title='Entregas · '+(EU.loja||'');$('#tabs').hidden=false;
  await carregar();
}
async function carregar(manual){
  if(!EU)return;
  const r=await sb.rpc('entregador_pedidos');
  if(r.error){if(/ENTREGADOR/.test(r.error.message)){EU=null;return telaCodigo('Este celular foi desconectado pela loja. Peça um código novo.')}if(manual)toast('Sem internet agora.');return}
  L=r.data||[];
  try{const g=await sb.rpc('entregador_resumo');if(!g.error)G=g.data}catch(e){}
  const novos=L.filter(o=>o.st=='conf'&&!vistos.has(o.id));novos.forEach(o=>vistos.add(o.id));
  if(novos.length&&!primeira){bip();toast('🔔 '+novos.length+' pedido(s) novo(s) para entregar')}
  primeira=false;desenhar();
}
function pagto(o){
  const tot=+o.total||0,pags=o.pags||[],din=pags.filter(g=>g.f=='Dinheiro').reduce((s,g)=>s+(+g.v||0),0);
  if(o.pay=='Pix')return `<div class="din pix">💠 Pix · ${R(tot)}<small>Confira com a loja se o Pix já foi pago antes de entregar.</small></div>`;
  if(o.pay=='Cartão')return `<div class="din cart">💳 Cartão · cobrar ${R(tot)}<small>Leve a maquininha.</small></div>`;
  const tr=+o.troco||0;return `<div class="din">💵 Dinheiro · receber ${R(tot)}${tr>0?`<small>Cliente paga com ${R(o.cash)} → <b>levar ${R(tr)} de troco</b></small>`:'<small>Sem troco</small>'}</div>`;
}
function card(o){
  const meu=o.rota&&EU&&o.rota.id==EU.id,outro=o.rota&&!meu,l=o.loc&&isFinite(o.loc.lat)?o.loc:null,tel=dig(o.ph),wa=tel?(tel.length<=11?'55'+tel:tel):'';
  const ent=o.st=='ent';
  return `<div class="card"><div class="top"><div><div class="nm">${esc(o.cn||'Cliente')}</div><span class="mu">#${esc(String(o.id).slice(-4).toUpperCase())} · ${new Date(o.date).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} · ${o.itens} ite${o.itens==1?'m':'ns'}</span></div>
   ${ent?'<span class="tag ok">✓ Entregue</span>':meu?'<span class="tag ac">🛵 Com você</span>':outro?`<span class="tag wn">Com ${esc(o.rota.nome)}</span>`:o.fat?'<span class="tag ok">Pronto para sair</span>':'<span class="tag wn">Separando na loja</span>'}</div>
   <div class="end">📍 ${esc(o.addr||'')}</div>${o.bairro?`<div class="mu" style="font-weight:700">Bairro ${esc(o.bairro)}</div>`:''}
   ${o.ref||o.obs?`<div class="ref">${o.ref?'🏠 '+esc(o.ref):''}${o.ref&&o.obs?'<br>':''}${o.obs?'📝 '+esc(o.obs):''}</div>`:''}
   ${ent?`<p class="mu" style="margin:6px 0 0">Entregue às ${new Date(o.entregue.date).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} · ${R(o.total)} (${esc(o.pay)})</p>`:pagto(o)}
   ${ent?'':`<div class="bts">
     ${l?`<a class="b" href="https://www.google.com/maps/dir/?api=1&destination=${l.lat},${l.lng}&travelmode=driving" target="_blank" rel="noopener">🗺️ Rota</a><a class="b s" href="https://waze.com/ul?ll=${l.lat},${l.lng}&navigate=yes" target="_blank" rel="noopener">Waze</a>`:`<a class="b w" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((o.addr||'')+' '+(o.bairro||''))}" target="_blank" rel="noopener">🗺️ Procurar endereço</a>`}
     ${tel?`<a class="b s" href="tel:${tel}">📞 Ligar</a><a class="b s" href="https://wa.me/${wa}" target="_blank" rel="noopener">💬 WhatsApp</a>`:''}
     ${outro?'':meu?`<button class="b s" onclick="soltar('${o.id}')">Não vou levar</button><button class="b ok" onclick="entregar('${o.id}')">✅ Entregue</button>`:`<button class="b w" onclick="pegar('${o.id}')">🛵 Vou levar este</button>`}
   </div>`}
   <details><summary>Ver os itens</summary><ul>${(o.items||[]).map(i=>`<li>${esc(i.q)} ${esc(i.u||'un')} · ${esc(i.n)}</li>`).join('')}</ul></details></div>`;
}
/* resumo do dia e do mês, valor de cada entrega e saldo a receber da loja */
function resumo(){
  if(!G)return '';const vl=G.modo=='taxa'?'a taxa de entrega de cada pedido':R(G.valor)+' por entrega';
  return `<div class="res"><div><small>Hoje</small><b>${G.hoje_n}</b><small>${R(G.hoje_v)}</small></div><div><small>No mês</small><b>${G.mes_n}</b><small>${R(G.mes_v)}</small></div>${+G.saldo>=0?`<div class="sal"><small>A receber</small><b>${R(G.saldo)}</b><small>da loja</small></div>`:`<div><small>Adiantado</small><b>${R(-G.saldo)}</b><small>a loja pagou a mais</small></div>`}</div>
  <p class="mu" style="margin:0 0 4px;font-size:13.5px;text-align:center">Você ganha ${vl}.${+G.hoje_din?` Dinheiro recebido de clientes hoje: <b>${R(G.hoje_din)}</b> (prestar contas na loja).`:''}</p>`;
}
function ganhos(){
  if(!G)return '<div class="vazio"><p class="mu">Carregando…</p></div>';
  const dia=d=>new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}),hr=d=>new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  return resumo()+`<div class="card"><h3 style="margin:0 0 4px">Entregas do mês (${G.entregas.length})</h3>${G.entregas.length?G.entregas.map(x=>`<div class="lin"><span>${dia(x.date)} ${hr(x.date)} · ${esc(x.cn||'Cliente')}${x.bairro?' <span class="mu">· '+esc(x.bairro)+'</span>':''}</span><b>${R(x.valor)}</b></div>`).join(''):'<p class="mu">Nenhuma entrega neste mês.</p>'}
  <div class="lin" style="font-size:17px"><span><b>Total do mês</b></span><b>${R(G.mes_v)}</b></div></div>
  <div class="card"><h3 style="margin:0 0 4px">Pagamentos da loja</h3>${G.pagamentos.length?G.pagamentos.map(p=>`<div class="lin"><span>${dia(p.date)}${p.obs?' · '+esc(p.obs):''}</span><b style="color:var(--ok)">${R(p.valor)}</b></div>`).join(''):'<p class="mu">Nenhum pagamento registrado ainda.</p>'}
  <div class="lin" style="font-size:17px"><span><b>${+G.saldo>=0?'Saldo a receber':'Adiantado (a loja pagou a mais)'}</b></span><b>${R(Math.abs(+G.saldo||0))}</b></div>
  <p class="mu" style="margin:6px 0 0;font-size:13px">Saldo = valor de todas as suas entregas − pagamentos que a loja já fez.</p></div>`;
}
function desenhar(){
  if(!EU)return;$('#t1').classList.toggle('on',aba=='fila');$('#t2').classList.toggle('on',aba=='feitas');$('#t3').classList.toggle('on',aba=='ganhos');
  const fila=L.filter(o=>o.st=='conf').sort((a,b)=>((b.rota&&b.rota.id==EU.id)-(a.rota&&a.rota.id==EU.id))||String(a.date).localeCompare(String(b.date))),feitas=L.filter(o=>o.st=='ent');
  $('#t1').textContent='Entregar ('+fila.length+')';$('#t2').textContent='Hoje ('+feitas.length+')';
  if(aba=='ganhos'){$('#m').innerHTML=ganhos();return}
  const l=aba=='fila'?fila:feitas;
  $('#m').innerHTML=(aba=='feitas'?resumo():'')+(l.length?l.map(card).join(''):`<div class="vazio"><div>${aba=='fila'?'😴':'📦'}</div><p class="mu">${aba=='fila'?'Nenhuma entrega agora. A lista atualiza sozinha.':'Nenhuma entrega feita hoje.'}</p></div>`);
}
async function pegar(id){const r=await sb.rpc('entregador_pegar',{p_id:id});if(r.error)toast(r.error.message);else toast('Pedido com você. Boa entrega!');carregar()}
async function soltar(id){await sb.rpc('entregador_soltar',{p_id:id});carregar()}
function entregar(id){
  const o=L.find(x=>x.id==id);if(!o)return;const tr=+o.troco||0;
  const ov=document.createElement('div');ov.className='ov';ov.onclick=e=>{if(e.target==ov)ov.remove()};
  ov.innerHTML=`<div class="card"><h2 style="margin:0 0 6px">Confirmar a entrega</h2><p style="font-size:17px">Pedido de <b>${esc(o.cn)}</b> entregue?</p>
  ${o.pay=='Dinheiro'?`<p class="din">💵 Recebeu ${R(o.total)}${tr>0?` e deu ${R(tr)} de troco`:''}?</p>`:o.pay=='Cartão'?`<p class="din cart">💳 Passou ${R(o.total)} no cartão?</p>`:`<p class="din pix">💠 Pix de ${R(o.total)} confirmado?</p>`}
  <div class="bts"><button class="b s" onclick="this.closest('.ov').remove()">Voltar</button><button class="b ok" id="eok">✅ Sim, entregue</button></div></div>`;
  document.body.appendChild(ov);
  $('#eok').onclick=async()=>{$('#eok').disabled=true;
    const loc=await new Promise(ok=>{if(!navigator.geolocation)return ok(null);navigator.geolocation.getCurrentPosition(p=>ok({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)}),()=>ok(null),{enableHighAccuracy:true,timeout:6000,maximumAge:30000})});
    const r=await sb.rpc('entregador_entregue',{p_id:id,p_loc:loc});ov.remove();
    if(r.error)return toast(r.error.message);toast('✅ Entrega registrada. A loja e o cliente já sabem.');carregar()};
}
setInterval(()=>{if(!document.hidden)carregar()},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)carregar()});
addEventListener('hashchange',()=>{const h=(location.hash.match(/c=([A-Za-z0-9-]+)/)||[])[1];if(h)parear(h)});
iniciar();
</script></body></html>
